<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle accent circle -->
  <circle cx="1050" cy="120" r="300" fill="#2563eb" fill-opacity="0.12"/>
  <circle cx="150" cy="520" r="240" fill="#6366f1" fill-opacity="0.10"/>

  <!-- Logo Mark -->
  <g transform="translate(100, 100)">
    <rect width="90" height="90" rx="20" fill="url(#brandGrad)"/>
    <path d="M28 20 h22 l16 16 v34 a4 4 0 0 1 -4 4 h-34 a4 4 0 0 1 -4 -4 z" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M50 20 v16 h16 z" fill="#dbeafe"/>
    <text x="44" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#2563eb" text-anchor="middle">P</text>
  </g>

  <!-- Brand Title -->
  <text x="215" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff">PDF<tspan fill="#60a5fa">ToolKit</tspan></text>
  <text x="215" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#94a3b8" letter-spacing="1.5">CLIENT-SIDE IN-BROWSER PDF SUITE</text>

  <!-- Hero Headline -->
  <text x="100" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#f8fafc">Free, Fast &amp; 100% Private</text>
  <text x="100" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#60a5fa">PDF Processing in Your Browser</text>

  <!-- Subtitle -->
  <text x="100" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">
    Merge, split, compress, edit, sign, and OCR documents locally with zero server uploads.
  </text>

  <!-- Privacy Pill -->
  <g transform="translate(100, 480)">
    <rect width="440" height="50" rx="25" fill="#065f46" fill-opacity="0.4" stroke="#059669" stroke-width="1.5"/>
    <circle cx="28" cy="25" r="7" fill="#10b981"/>
    <text x="50" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#a7f3d0">100% Client-Side &bull; Zero Server Storage</text>
  </g>
</svg>
