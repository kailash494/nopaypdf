<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Edit-PDF Color Matching Test Runner</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="../assets/js/tools/edit-pdf/font-manager.js"></script>
    <script src="../assets/js/tools/edit-pdf/text-extractor.js"></script>
    <script src="../assets/js/tools/edit-pdf/content-stream-editor.js"></script>
    <script src="../assets/js/tools/edit-pdf/editor-state.js"></script>
    <script src="../assets/js/tools/edit-pdf/canvas-stage.js"></script>
    <script src="../assets/js/tools/edit-pdf/pdf-exporter.js"></script>
</head>
<body style="font-family: sans-serif; padding: 20px;">
    <h1>Edit-PDF Color Matching Automated Verification</h1>
    <div id="status">Running tests...</div>
    <pre id="output"></pre>

    <script>
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    async function runTest() {
        const out = [];
        function log(msg) {
            console.log(msg);
            out.push(msg);
            document.getElementById('output').textContent = out.join('\n');
        }

        try {
            log('1. Generating synthetic test PDF with orange header (#F26522) and grey body label (#666666)...');
            const { PDFDocument, rgb } = window.PDFLib;
            const pdfDoc = await PDFDocument.create();
            const page = pdfDoc.addPage([612, 792]);

            // Orange header banner (#F26522) at Y=700..792
            page.drawRectangle({
                x: 0,
                y: 700,
                width: 612,
                height: 92,
                color: rgb(242/255, 101/255, 34/255),
            });

            // Orange decorative accent graphic near top
            page.drawRectangle({
                x: 40,
                y: 670,
                width: 120,
                height: 12,
                color: rgb(242/255, 101/255, 34/255),
            });

            // Medium-grey label (#666666) on pure white background lower on the page
            page.drawText('Beneficiary Bank', {
                x: 50,
                y: 450,
                size: 12,
                color: rgb(102/255, 102/255, 102/255),
            });

            // Black value text (#000000) on pure white background
            page.drawText('Chase Bank NA', {
                x: 50,
                y: 420,
                size: 12,
                color: rgb(0, 0, 0),
            });

            const pdfBytes = await pdfDoc.save();
            log(`✓ Synthetic PDF generated (${pdfBytes.length} bytes)`);

            log('2. Loading PDF into PDF.js and rendering base canvas...');
            const loadingTask = window.pdfjsLib.getDocument({ data: pdfBytes.slice(0) });
            const loadedPdf = await loadingTask.promise;
            const pdfPage = await loadedPdf.getPage(1);

            const scale = 1.5;
            const dpr = 2;
            const viewport = pdfPage.getViewport({ scale });
            const canvas = document.createElement('canvas');
            canvas.width = viewport.width * dpr;
            canvas.height = viewport.height * dpr;
            canvas.style.width = `${viewport.width}px`;
            canvas.style.height = `${viewport.height}px`;

            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);
            await pdfPage.render({ canvasContext: ctx, viewport }).promise;
            log('✓ Base canvas rendered at scale 1.5 and dpr 2');

            log('3. Extracting text blocks and sampling clean canvas colors...');
            const extracted = await window.TextExtractor.extractPageText(pdfPage, 0);
            const blocks = extracted.blocks;
            log(`✓ Extracted ${blocks.length} text block(s)`);

            // Run authoritative canvas sampling
            window.TextExtractor.sampleBlockColors(canvas, blocks, scale, 792);

            const greyBlock = blocks.find(b => b.originalText.includes('Beneficiary Bank'));
            const blackBlock = blocks.find(b => b.originalText.includes('Chase Bank NA'));

            if (!greyBlock) throw new Error('Grey label "Beneficiary Bank" not found in extracted blocks');
            if (!blackBlock) throw new Error('Black text "Chase Bank NA" not found in extracted blocks');

            log('\n--- Assertion 1: Grey Label Background (Auto) ---');
            log(`Grey block bgHex: ${greyBlock.bgHex}`);
            log(`Grey block autoBgHex: ${greyBlock.autoBgHex}`);
            log(`Grey block hasVectorBg: ${greyBlock.hasVectorBg}`);

            if (greyBlock.bgHex.toLowerCase() !== '#ffffff') {
                throw new Error(`Assertion Failed: Grey block bgHex expected #ffffff, got ${greyBlock.bgHex}`);
            }
            if (greyBlock.autoBgHex.toLowerCase() !== '#ffffff') {
                throw new Error(`Assertion Failed: Grey block autoBgHex expected #ffffff, got ${greyBlock.autoBgHex}`);
            }
            if (greyBlock.hasVectorBg !== false) {
                throw new Error(`Assertion Failed: Grey block hasVectorBg expected false, got ${greyBlock.hasVectorBg}`);
            }
            log('✓ PASS: Grey label Auto background resolved to #FFFFFF (NOT orange #F26522)');

            log('\n--- Assertion 2: Grey Label Text Color Matching ---');
            log(`Grey block colorHex: ${greyBlock.colorHex}`);
            // Check that it's in the #666666 range (not #000000 or #1e293b)
            const r = parseInt(greyBlock.colorHex.slice(1, 3), 16);
            const g = parseInt(greyBlock.colorHex.slice(3, 5), 16);
            const b_col = parseInt(greyBlock.colorHex.slice(5, 7), 16);
            log(`Detected RGB: (${r}, ${g}, ${b_col})`);

            if (greyBlock.colorHex === '#000000' || greyBlock.colorHex === '#1e293b') {
                throw new Error(`Assertion Failed: Grey block colorHex defaulted to black: ${greyBlock.colorHex}`);
            }
            // Allow small anti-aliasing delta around 102 (#666666)
            if (Math.abs(r - 102) > 15 || Math.abs(g - 102) > 15 || Math.abs(b_col - 102) > 15) {
                throw new Error(`Assertion Failed: Grey block colorHex (${greyBlock.colorHex}) is not close to #666666`);
            }
            log('✓ PASS: Detected text color matches medium-grey (#666666), NOT hardcoded black');

            log('\n--- Assertion 3: Black Value Text Color Matching ---');
            log(`Black block colorHex: ${blackBlock.colorHex}`);
            if (blackBlock.colorHex !== '#000000') {
                throw new Error(`Assertion Failed: Black block colorHex expected #000000, got ${blackBlock.colorHex}`);
            }
            log('✓ PASS: Detected black text color matches #000000');

            log('\n--- Assertion 4: Editing & Seamless Export (Zero Orange Mask Boxes) ---');
            // Simulate editing the grey block to a longer string
            greyBlock.currentText = 'Beneficiary Bank Name asd';
            greyBlock.modified = true;

            // Setup EditorState mock
            window.EditorState.originalArrayBuffer = pdfBytes.slice(0).buffer;
            window.EditorState.pages = [{
                sourcePageIndex: 0,
                widthPt: 612,
                heightPt: 792,
                textBlocks: blocks,
                links: [],
                formFields: [],
                fabricJson: null,
            }];

            const exportedBytes = await window.PdfExporter.exportPdf();
            log(`✓ Exported PDF generated (${exportedBytes.length} bytes)`);

            // Verify exported PDF does not contain orange rectangles over the edited text
            const exportedDoc = await PDFDocument.load(exportedBytes);
            const exportedPage = exportedDoc.getPage(0);
            const exportedText = await (async () => {
                const doc = await window.pdfjsLib.getDocument({ data: exportedBytes }).promise;
                const p = await doc.getPage(1);
                const tc = await p.getTextContent();
                return tc.items.map(i => i.str).join(' ');
            })();

            log(`Exported page text: "${exportedText}"`);
            if (!exportedText.includes('Beneficiary Bank Name asd')) {
                throw new Error('Assertion Failed: Exported PDF missing edited text "Beneficiary Bank Name asd"');
            }
            log('✓ PASS: Exported PDF contains new replacement text');

            // Decompress page contents to verify no orange mask rectangle was drawn over text
            const latin1Decoder = new TextDecoder('latin1');
            const contentsRef = exportedPage.node.Contents();
            let allContentStr = '';
            const { PDFArray, decodePDFRawStream } = window.PDFLib;
            if (contentsRef instanceof PDFArray) {
                for (let i = 0; i < contentsRef.size(); i++) {
                    const s = contentsRef.lookup(i);
                    if (s) {
                        try {
                            const b = decodePDFRawStream(s).decode();
                            allContentStr += latin1Decoder.decode(b) + '\n';
                        } catch (e) {}
                    }
                }
            } else if (contentsRef) {
                try {
                    const b = decodePDFRawStream(contentsRef).decode();
                    allContentStr = latin1Decoder.decode(b);
                } catch (e) {}
            }
            const contentStr = allContentStr;

            // In PDF syntax, orange fill is "0.949 0.396 0.133 rg" or similar with "re f"
            // Search if any orange rectangle is drawn near Y=450
            const reRegex = /([\d\.\-]+)\s+([\d\.\-]+)\s+([\d\.\-]+)\s+([\d\.\-]+)\s+re/g;
            let match;
            let orangeRectCount = 0;
            while ((match = reRegex.exec(contentStr)) !== null) {
                const rx = parseFloat(match[1]);
                const ry = parseFloat(match[2]);
                const rw = parseFloat(match[3]);
                const rh = parseFloat(match[4]);
                // If a rectangle is near y=450 (where body text was edited)
                if (ry >= 400 && ry <= 480) {
                    orangeRectCount++;
                }
            }
            log(`Rectangles drawn near body text (Y=400..480): ${orangeRectCount}`);
            if (orangeRectCount > 0) {
                throw new Error(`Assertion Failed: Found ${orangeRectCount} unexpected cover rectangles near body text`);
            }
            log('✓ PASS: Exported PDF has zero orange mask/cover rectangles over edited text');

            document.getElementById('status').textContent = 'TEST PASSED';
            document.getElementById('status').style.color = 'green';
            window.__TEST_RESULT__ = { status: 'PASSED', log: out };
            try {
                await fetch('/report-result', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(window.__TEST_RESULT__),
                });
            } catch (e) {}
        } catch (err) {
            log(`\n❌ ERROR: ${err.message}\n${err.stack}`);
            document.getElementById('status').textContent = 'TEST FAILED';
            document.getElementById('status').style.color = 'red';
            window.__TEST_RESULT__ = { status: 'FAILED', error: err.message, stack: err.stack, log: out };
            try {
                await fetch('/report-result', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(window.__TEST_RESULT__),
                });
            } catch (e) {}
        }
    }

    runTest();
    </script>
</body>
</html>
